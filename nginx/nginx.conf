# Reverse proxy HTTPS. Le certificat d'entreprise est attendu dans nginx/certs :
#   certificat.crt  (certificat + chaîne intermédiaire, au format PEM)
#   certificat.key  (clé privée)

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/certificat.crt;
    ssl_certificate_key /etc/nginx/certs/certificat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 3m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://unpkg.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Écrasé, pas complété : l'application compte les échecs de connexion par adresse
        # et prend la première de la liste ; le client ne doit pas pouvoir l'imposer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass http://app:8000;
        expires 7d;
        add_header Cache-Control "public";
    }
}
