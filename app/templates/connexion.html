{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block classe_page %}etroit{% endblock %}
{% block contenu %}
<div class="feuille">
  <p class="sur-titre">Espace salarié</p>
  <h1>Connexion</h1>
  {% if erreur %}<div class="flash erreur" role="alert">{{ erreur }}</div>{% endif %}
  <form method="post" action="/connexion">
    <div class="champ">
      <label for="identifiant">Matricule ou e-mail</label>
      <input id="identifiant" name="identifiant" type="text" autocomplete="username" required autofocus
             value="{{ identifiant or '' }}">
    </div>
    <div class="champ">
      <label for="mot_de_passe">Mot de passe</label>
      <input id="mot_de_passe" name="mot_de_passe" type="password" autocomplete="current-password" required>
    </div>
    <div class="champ">
      <label class="case"><input type="checkbox" name="rester_connecte" checked>
        <span>Rester connecté sur cet appareil<span class="aide">Décochez sur un ordinateur partagé.</span></span></label>
    </div>
    <button class="bouton" type="submit">Se connecter</button>
  </form>
  <p class="discret" style="margin-top:16px">Mot de passe oublié : contactez votre administrateur.</p>
</div>
{% endblock %}
