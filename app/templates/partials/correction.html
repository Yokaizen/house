{# Actions sur un badgeage p (manager / administrateur). #}
<details class="correction">
  <summary>{{ 'Arrivée' if p.type == 'entree' else 'Départ' }} {{ p.horodatage|heure }}</summary>
  {% if valider and p.statut_validation == 'en_attente' %}
  <form method="post" action="/pointages/{{ p.id }}/valider">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="retour" value="{{ request.url.path }}{{ '?' ~ retour if retour }}">
    <div class="champ"><input type="text" name="commentaire" placeholder="Commentaire (facultatif)"></div>
    <div class="actions"><button class="bouton petit" name="decision" value="valider">Valider</button>
      <button class="bouton petit rose" name="decision" value="refuser">Refuser</button></div>
  </form>
  {% endif %}
  {% if corriger %}
  <form method="post" action="/pointages/{{ p.id }}/modifier">
    <input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="retour" value="{{ retour }}">
    <div class="ligne-champs">
      <div class="champ"><select name="type" aria-label="Type"><option value="entree" {{ 'selected' if p.type == 'entree' }}>Arrivée</option><option value="sortie" {{ 'selected' if p.type == 'sortie' }}>Départ</option></select></div>
      <div class="champ"><input type="date" name="jour" value="{{ p.horodatage|date_iso }}" required aria-label="Date"></div>
      <div class="champ"><input type="time" name="heure" value="{{ p.horodatage|heure }}" required aria-label="Heure"></div>
    </div>
    <div class="champ"><input type="text" name="motif" placeholder="Motif de la correction (obligatoire)" required minlength="3"></div>
    <button class="bouton petit">Corriger</button>
  </form>
  <form method="post" action="/pointages/{{ p.id }}/supprimer" onsubmit="return confirm('Supprimer ce badgeage ?')">
    <input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="retour" value="{{ retour }}">
    <div class="champ"><input type="text" name="motif" placeholder="Motif de la suppression (obligatoire)" required minlength="3"></div>
    <button class="bouton petit rose">Supprimer</button>
  </form>
  {% endif %}
</details>
