[project]
name = "sante-sync"
version = "1.0.0"
description = "Collecte quotidienne des données de santé (Apple Santé via Health Auto Export) vers des CSV lisibles par une IA."
requires-python = ">=3.10"
dependencies = ["keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sante-sync = "sante_sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sante_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
